<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#FAF8F5">
    <title>修改密钥 · 小本本</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='diary/diary.css') }}">
</head>
<body>
<div class="page">
    <header class="site-header">
        <div class="site-header-inner">
            <div class="site-header-left">
                <a href="/diary/" class="site-wordmark">小本本<em>·</em></a>
            </div>
            <div class="site-header-right">
                <span class="role-badge {{ user.role }}">{{ '主人' if user.role == 'master' else '母狗' }}</span>
                <button class="icon-btn" id="logoutBtn" title="退出">✕</button>
            </div>
        </div>
    </header>

    <div class="page-content">
        <div class="chpwd-page">
            <div class="chpwd-card">
                <h1 class="chpwd-title">修改密钥</h1>
                <p class="chpwd-sub">请设置一个新的密钥，至少 10 位</p>

                <div id="changeError" class="login-error" style="margin-bottom:16px"></div>

                <form id="pwdForm" autocomplete="off">
                    <div class="fg">
                        <label class="fg-label" for="oldPwd">当前密钥</label>
                        <input type="password" id="oldPwd" class="fg-input"
                            placeholder="当前密钥" autocomplete="current-password" required>
                    </div>
                    <div class="fg">
                        <label class="fg-label" for="newPwd">新密钥</label>
                        <input type="password" id="newPwd" class="fg-input"
                            placeholder="至少 10 位" autocomplete="new-password" minlength="10" required>
                    </div>
                    <div class="fg">
                        <label class="fg-label" for="confirmPwd">确认新密钥</label>
                        <input type="password" id="confirmPwd" class="fg-input"
                            placeholder="再输一次" autocomplete="new-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary" id="submitBtn"
                        style="width:100%;margin-top:4px">保存</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    const form = document.getElementById('pwdForm');
    const errorEl = document.getElementById('changeError');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.className = 'login-error';
        const oldPwd = document.getElementById('oldPwd').value;
        const newPwd = document.getElementById('newPwd').value;
        const confirmPwd = document.getElementById('confirmPwd').value;

        if (newPwd !== confirmPwd) { showError('两次新密钥不一致'); return; }
        if (newPwd.length < 10) { showError('新密钥至少 10 位'); return; }

        submitBtn.disabled = true; submitBtn.textContent = '保存中…';
        try {
            const r = await fetch('/diary/auth/api/change_password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ old_password: oldPwd, new_password: newPwd }),
            });
            const data = await r.json();
            if (!r.ok || !data.ok) { showError(data.error || '修改失败'); return; }
            submitBtn.textContent = '已保存';
            setTimeout(() => { window.location.href = '/diary/'; }, 1200);
        } catch { showError('网络异常'); }
        finally { submitBtn.disabled = false; submitBtn.textContent = '保存'; }
    });

    function showError(msg) {
        errorEl.textContent = msg;
        errorEl.className = 'login-error show';
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
        fetch('/diary/auth/api/logout', { method:'POST' }).then(() => { window.location.href = '/diary/auth/login'; });
    });
})();
</script>
</body>
</html>
