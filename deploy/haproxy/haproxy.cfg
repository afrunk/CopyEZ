global
    log /dev/log local0 notice
    maxconn 8192

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    timeout connect 5s
    timeout client  3600s
    timeout server  3600s
    retries 2

# 5000 端口同时接受 TLS 和明文 HTTP：
#   - 收到 TLS ClientHello → 转发到 nginx 的 127.0.0.1:8443（HTTPS 站点）
#   - 收到明文 HTTP      → 转发到 nginx 的 127.0.0.1:8080（301 跳到 HTTPS）
# 这样老书签 http://39.106.147.188:5000/ 不再看到 nginx 的 400 页面，
# 而 https://39.106.147.188:5000/（iPhone PWA / Service Worker）保持不变。
frontend fe_5000
    bind 0.0.0.0:5000
    bind [::]:5000
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend be_tls if { req.ssl_hello_type 1 }
    default_backend be_http

backend be_tls
    server tls 127.0.0.1:8443

backend be_http
    server http 127.0.0.1:8080
