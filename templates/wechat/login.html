<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>登录 · 私密聊天</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='wechat/wechat.css') }}">
</head>
<body>
    <div class="wx-login-page">
        <!-- Brand -->
        <div class="wx-login-brand">
        </div>

        <div class="wx-login-card">
            <!-- Toast error (slides in from top) -->
            <div class="wx-login-toast" id="loginError"></div>

            <form id="loginForm" autocomplete="off">
                <div class="wx-fg">
                    <label class="wx-label" for="usernameInput">账号</label>
                    <div class="wx-input-wrap" id="userWrap">
                        <span class="wx-input-icon">👤</span>
                        <input type="text" id="usernameInput" class="wx-input"
                            placeholder="" autocomplete="username" autofocus required>
                        <div class="wx-input-focus-bar"></div>
                    </div>
                </div>
                <div class="wx-fg">
                    <label class="wx-label" for="passwordInput">密码</label>
                    <div class="wx-input-wrap" id="pwWrap">
                        <span class="wx-input-icon">🔒</span>
                        <input type="password" id="passwordInput" class="wx-input"
                            placeholder="" autocomplete="current-password" required>
                        <div class="wx-input-focus-bar"></div>
                        <button type="button" class="wx-pw-toggle" id="pwToggle" tabindex="-1">👁</button>
                    </div>
                </div>
                <button type="submit" class="wx-btn wx-btn-primary" id="submitBtn">登录</button>
            </form>
        </div>
    </div>

    <script>
    (function() {
        const form = document.getElementById('loginForm');
        const errorEl = document.getElementById('loginError');
        const submitBtn = document.getElementById('submitBtn');
        const usernameInput = document.getElementById('usernameInput');
        const passwordInput = document.getElementById('passwordInput');
        const userWrap = document.getElementById('userWrap');
        const pwWrap = document.getElementById('pwWrap');
        const pwToggle = document.getElementById('pwToggle');

        // Password show/hide
        let pwVisible = false;
        pwToggle.addEventListener('click', () => {
            pwVisible = !pwVisible;
            passwordInput.type = pwVisible ? 'text' : 'password';
            pwToggle.textContent = pwVisible ? '🙈' : '👁';
        });

        // Shake animation on wrong password
        function shakeWrap(el) {
            el.classList.remove('shake');
            void el.offsetWidth; // reflow
            el.classList.add('shake');
            el.addEventListener('animationend', () => el.classList.remove('shake'), {once:true});
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.style.display = 'none';
            errorEl.className = 'wx-login-toast';
            submitBtn.textContent = '登录中…';
            submitBtn.disabled = true;

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                showError('请输入账号和密码');
                return;
            }

            try {
                const r = await fetch('/wechat/auth/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                const data = await r.json();
                if (!r.ok || !data.ok) {
                    showError(data.error || '登录失败');
                    shakeWrap(pwWrap);
                    return;
                }
                submitBtn.textContent = '进入中…';
                window.location.href = data.next || '/wechat/';
            } catch {
                showError('网络异常，请重试');
            }
        });

        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.style.display = 'block';
            errorEl.className = 'wx-login-toast show';
            submitBtn.textContent = '登录';
            submitBtn.disabled = false;
            passwordInput.value = '';
            passwordInput.focus();
        }

        usernameInput.addEventListener('input', () => { errorEl.style.display='none'; });
        passwordInput.addEventListener('input', () => { errorEl.style.display='none'; });
    })();
    </script>
</body>
</html>
