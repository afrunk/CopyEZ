<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1A1410">
    <title>登录 · 小本本</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='diary/diary.css') }}">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <p class="login-eyebrow">Private Diary</p>
            <h1 class="login-title">小本本</h1>
            <p class="login-subtitle">记录每一次成长</p>

            <div id="loginError" class="login-error"></div>

            <form id="loginForm" autocomplete="off">
                <div class="fg">
                    <label class="fg-label" for="usernameInput">账号</label>
                    <input type="text" id="usernameInput" class="fg-input"
                        placeholder="主人 M 或 母狗 S" autocomplete="username" autofocus required>
                </div>
                <div class="fg">
                    <label class="fg-label" for="passwordInput">密码</label>
                    <input type="password" id="passwordInput" class="fg-input"
                        placeholder="请输入密码" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary" id="submitBtn">进入</button>
            </form>

            <div class="login-footer">小本本 &middot; 仅限受邀者</div>
        </div>
    </div>

    <script>
    (function() {
        const form = document.getElementById('loginForm');
        const errorEl = document.getElementById('loginError');
        const submitBtn = document.getElementById('submitBtn');
        const usernameInput = document.getElementById('usernameInput');
        const passwordInput = document.getElementById('passwordInput');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.className = 'login-error';
            submitBtn.textContent = '验证中…';
            submitBtn.disabled = true;

            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            if (!username) { showError('请输入账号'); return; }
            if (!password) { showError('请输入密码'); return; }

            try {
                const r = await fetch('/diary/auth/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                const data = await r.json().catch(() => ({}));
                const isSuccess = data.ok === true;
                if (!isSuccess) {
                    showError(data.error || '账号或密码错误');
                    return;
                }
                submitBtn.textContent = '进入中…';
                window.location.href = data.next || '/diary/';
            } catch {
                showError('网络异常，请重试');
            }
        });

        [usernameInput, passwordInput].forEach(el => {
            el.addEventListener('input', () => {
                if (errorEl.classList.contains('show')) errorEl.classList.remove('show');
            });
        });

        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.className = 'login-error show';
            submitBtn.textContent = '进入';
            submitBtn.disabled = false;
            passwordInput.value = '';
            passwordInput.focus();
        }
    })();
    </script>
</body>
</html>
