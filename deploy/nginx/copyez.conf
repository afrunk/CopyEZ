server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt HTTP-01 校验
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # 明文兜底（没有 HTTPS 时也能用，但推送不可用）
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        # $http_host 保留客户端原始端口（:5000），$host 会丢掉端口，
        # 导致 Flask 的 redirect（/wechat → /wechat/、未登录跳登录页）丢端口跳到 443。
        # 注意：不要加 X-Forwarded-Port $server_port —— 经 haproxy 转发后
        # nginx 看到的本机端口是 8443，不是对外端口，传了反而会污染端口。
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }
}

server {
    # 443 是标准 HTTPS 入口。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # 5000 端口的 TLS 部分由 stream 模块分流后转发到这里（只监听本机）。
    listen 127.0.0.1:8443 ssl http2;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/39.106.147.188/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/39.106.147.188/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        # $http_host 保留客户端原始端口（:5000），$host 会丢掉端口，
        # 导致 Flask 的 redirect（/wechat → /wechat/、未登录跳登录页）丢端口跳到 443。
        # 注意：不要加 X-Forwarded-Port $server_port —— 经 haproxy 转发后
        # nginx 看到的本机端口是 8443，不是对外端口，传了反而会污染端口。
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# 5000 端口收到明文 HTTP 时（老书签、手机桌面图标里存的是 http://），
# nginx 默认会直接回 "400 The plain HTTP request was sent to HTTPS port"。
# 这里改成 301 跳到 HTTPS 同一个地址，避免用户看到 400 页面。
server {
    listen 127.0.0.1:8080;
    server_name _;
    return 301 https://39.106.147.188:5000$request_uri;
}
