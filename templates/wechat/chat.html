<!DOCTYPE html>

<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>聊天</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='wechat/wechat.css') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='wechat/login-history.css') }}">

    <link rel="manifest" href="{{ url_for('static', filename='wechat/manifest.json') }}">

    <meta name="theme-color" content="#6366F1">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta name="apple-mobile-web-app-title" content="CopyEZ">

    <link rel="apple-touch-icon" href="{{ url_for('static', filename='wechat/icon-192.png') }}">

</head>

<body>

    <div class="wx-page">

        <!-- ── Header ── -->

        <div class="wx-header">

            <div class="wx-header-info">

                <div class="wx-header-avatar" id="headerAvatar">·</div>

                <div class="wx-header-text">

                    <div class="wx-header-name" id="headerName">加载中…</div>

                    <div class="wx-header-status" id="headerStatus"></div>

                </div>

            </div>

            <div class="wx-header-badge" id="headerBadge" style="display:none">0</div>

            <button type="button" class="wx-header-action" id="settingsBtn" title="设置">

                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.488.488 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.04.31-.06.63-.06.94 0 .31.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>

            </button>

            <button type="button" class="wx-header-action" id="pushBtn" title="手机提醒" style="display:none">

                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6V11c0-3.07-1.64-5.64-4.5-6.32V4a1.5 1.5 0 0 0-3 0v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>

            </button>

            <button type="button" class="wx-header-action" id="headerAction" title="登录历史" style="display:none">

                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M13 3a9 9 0 1 0 8 8h-2.05A7 7 0 1 1 13 5.05V3zm-1 4v5.41l3.29 3.3 1.42-1.42L14 11.59V7h-2zm7.5-4.5V5H22V3h-2.5V.5h-2V3H15v2h2.5v2.5h2V5H22V3h-2.5z"/></svg>

            </button>

            <button class="wx-header-action" id="searchBtn" title="搜索">

                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>

            </button>

        </div>

        <!-- ── Search overlay ── -->

        <div class="wx-search-overlay" id="searchOverlay" style="display:none">

            <div class="wx-search-bar">

                <input type="text" id="searchInput" placeholder="搜索聊天记录…" autocomplete="off">

                <button class="wx-search-close" id="searchClose">取消</button>

            </div>

            <div class="wx-search-results" id="searchResults"></div>

        </div>

        <!-- ── Chat body ── -->

        <div class="wx-chat-body" id="chatBody">

            <div class="wx-msg-empty" id="emptyState">

                <div class="wx-msg-empty-icon">💬</div>

                <div>暂无消息，开始聊天吧</div>

            </div>

        </div>

        <!-- ── Input bar ── -->

        <div class="wx-input-bar">

            <input type="file" id="imgInput" accept="image/*" multiple style="display:none">

            <button type="button" class="wx-extra-btn" id="emojiBtn" title="表情">

                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>

            </button>

            <button class="wx-extra-btn" id="imgBtn" title="发送图片">

                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5l3.5-4.5z"/></svg>

            </button>

            <input type="text" id="msgInput" placeholder="输入消息…" autocomplete="off" autofocus>

            <button class="wx-send-btn" id="sendBtn">

                <svg class="wx-send-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>

                <span class="wx-send-text">发送</span>

            </button>

        </div>

        <!-- ── Emoji panel ── -->

        <div class="wx-emoji-panel" id="emojiPanel" style="display:none"></div>

        <!-- ── Image preview bar ── -->

        <div class="wx-preview-bar" id="previewBar" style="display:none">

            <div class="wx-preview-list" id="previewList"></div>

            <button class="wx-preview-clear" id="previewClear">清除</button>

        </div>

    </div>

    <!-- ── Lightbox (Phase 2) ── -->

    <div class="wx-lightbox" id="lightbox" style="display:none" role="dialog" aria-label="图片查看器">

        <div class="wx-lb-bg" id="lbBg"></div>

        <!-- Top bar -->

        <div class="wx-lb-topbar" id="lbTopbar">

            <span class="wx-lb-counter" id="lbCounter">1 / 1</span>

            <div class="wx-lb-top-actions">

                <button class="wx-lb-btn" id="lbInfoBtn" title="图片信息">ℹ</button>

                <button class="wx-lb-btn" id="lbFsBtn" title="全屏 (F)">⛶</button>

                <button class="wx-lb-btn wx-lb-close" id="lightboxClose" title="关闭 (Esc)">&#x2715;</button>

            </div>

        </div>

        <!-- Image meta -->

        <div class="wx-lb-meta" id="lbMeta" style="display:none"></div>

        <!-- Image stage -->

        <div class="wx-lb-stage" id="lbStage">

            <div class="wx-lb-img-wrap" id="lbImgWrap">

                <img class="wx-lb-img" id="lbImg" src="" alt="" draggable="false">

            </div>

        </div>

        <!-- Info panel -->

        <div class="wx-lb-info" id="lbInfo" style="display:none">

            <div class="wx-lb-info-title" id="lbInfoTitle">图片信息</div>

            <div class="wx-lb-info-row"><span>文件名</span><span id="lbFileName">—</span></div>

            <div class="wx-lb-info-row"><span>尺寸</span><span id="lbDimensions">—</span></div>

            <div class="wx-lb-info-row"><span>大小</span><span id="lbFileSize">—</span></div>

            <div class="wx-lb-info-row"><span>编号</span><span id="lbIndex">—</span></div>

        </div>

        <!-- Bottom thumbnail strip -->

        <div class="wx-lb-thumbstrip" id="lbThumbstrip">

            <div class="wx-lb-thumbs" id="lbThumbs"></div>

        </div>

    </div>

    <script>

    (function() {

        const chatBody  = document.getElementById('chatBody');

        const emptyState = document.getElementById('emptyState');

        const msgInput  = document.getElementById('msgInput');

        const sendBtn   = document.getElementById('sendBtn');

        let myId = null, myName = '我';

        let partnerInfo = null;

        let messages = [], prevDate = '';

        let hasMoreMessages = false;

        let loadingMessages = false;

        let loadingOlder = false;

        /* 模块级 myUser，avatar 事件监听器和 loadMessages 静默刷新都依赖它 */

        let myUser = null;

        /* ── Header refs ── */

        const headerAvatar = document.getElementById('headerAvatar');

        const headerName   = document.getElementById('headerName');

        const headerStatus = document.getElementById('headerStatus');

        const headerBadge  = document.getElementById('headerBadge');

        const headerAction = document.getElementById('headerAction');

        const settingsBtn  = document.getElementById('settingsBtn');

        settingsBtn.addEventListener('click', () => { window.location.href = '/wechat/settings'; });

        headerAction.addEventListener('click', () => {

            if (myUser?.username === '蛋蛋') {

                showLoginHistory();

            }

        });

        function showLoginHistory() {

            let modal = document.getElementById('loginHistoryModal');

            if (modal) { modal.remove(); return; }

            modal = document.createElement('div');

            modal.id = 'loginHistoryModal';

            modal.className = 'wx-history-modal';

            modal.innerHTML = `

                <div class="wx-history-card" role="dialog" aria-modal="true" aria-label="笨笨登录历史">

                    <div class="wx-history-title">笨笨登录历史</div>

                    <button type="button" class="wx-history-close" aria-label="关闭">×</button>

                    <div class="wx-history-list"><div class="wx-history-loading">加载中…</div></div>

                </div>`;

            document.body.appendChild(modal);

            const close = () => modal.remove();

            modal.querySelector('.wx-history-close').addEventListener('click', close);

            modal.addEventListener('click', event => { if (event.target === modal) close(); });

            fetch('/wechat/api/login-history?limit=100')

                .then(response => response.json().then(data => ({ok: response.ok, data})))

                .then(({ok, data}) => {

                    if (!ok) throw new Error(data.error || '加载失败');

                    const list = modal.querySelector('.wx-history-list');

                    if (!data.entries?.length) {

                        list.innerHTML = '<div class="wx-history-empty">暂无登录记录</div>';

                        return;

                    }

                    list.innerHTML = data.entries.map(entry => {

                        const time = entry.logged_in_at ? new Date(entry.logged_in_at).toLocaleString('zh-CN', {

                            year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,

                        }) : '时间未知';

                        return `<div class="wx-history-entry"><span>${escHtml(time)}</span><span>${escHtml(entry.ip_address || '未知地址')}</span></div>`;

                    }).join('');

                })

                .catch(error => { modal.querySelector('.wx-history-list').innerHTML = `<div class="wx-history-empty">${escHtml(error.message)}</div>`; });

        }

        /* ── Avatar rendering ── */

        function renderAvatarEl(el, user, isMine) {

            el.innerHTML = '';

            el.style.background = '';

            if (user.avatar_type === 'image' && user.avatar_url) {

                const img = document.createElement('img');

                img.className = 'wx-avatar-img';

                img.src = user.avatar_url;

                img.alt = '';

                el.appendChild(img);

            } else if (user.avatar_type === 'emoji' && user.avatar_emoji) {

                el.style.background = 'transparent';

                el.style.border = 'none';

                el.style.fontSize = '28px';

                el.textContent = user.avatar_emoji;

            } else {

                const color = user.avatar_color || (isMine ? '#6366F1' : '#576B95');

                el.style.background = color;

                el.style.fontSize = '12px';

                el.style.border = '1px solid rgba(255,255,255,0.08)';

                el.textContent = (user.display_name || '?')[0].toUpperCase();

            }

        }

        function renderHeader() {

            if (!partnerInfo) {

                headerName.textContent = '对方'; headerAvatar.textContent = '?'; headerAction.style.display = 'none'; return;

            }

            renderAvatarEl(headerAvatar, partnerInfo, false);

            headerName.textContent = partnerInfo.display_name;

            headerStatus.textContent = formatLastSeen(partnerInfo.last_seen);

            headerAction.style.display = myUser?.username === '蛋蛋' ? 'flex' : 'none';

        }

        function formatLastSeen(iso) {

            if (!iso) return '从未上线';

            try {

                const d = new Date(iso);

                return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')} 上线`;

            } catch { return ''; }

        }

        async function markMessagesRead(items = messages) {

            const messageIds = items
                .filter(message => !message.is_mine && !message.is_read)
                .map(message => message.id);

            if (!messageIds.length) return;

            try {

                const r = await fetch('/wechat/api/messages/mark_read', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message_ids: messageIds}),
                });

                if (r.ok) {
                    const readIds = new Set(messageIds);
                    messages.forEach(message => {
                        if (readIds.has(message.id)) message.is_read = true;
                    });
                }

            } catch (error) { console.error('mark read failed', error); }

        }

        async function refreshUnread() {

            try {

                const r = await fetch('/wechat/api/unread_count');

                if (!r.ok) return;

                const n = (await r.json()).unread || 0;

                if (n > 0) {

                    headerBadge.textContent = n > 99 ? '99+' : n;

                    headerBadge.style.display = 'flex';

                } else {

                    headerBadge.style.display = 'none';

                }

            } catch {}

        }

        /* ── Mark read ── */

        let markReadPending = false;

        async function tryMarkRead() {

            if (markReadPending) return;

            const ids = messages.filter(m => !m.is_mine && !m.is_read).map(m => m.id);

            if (!ids.length) { headerBadge.style.display='none'; return; }

            markReadPending = true;

            try {

                await fetch('/wechat/api/messages/mark_read', {

                    method: 'POST', headers:{'Content-Type':'application/json'},

                    body: JSON.stringify({message_ids: ids}),

                });

                messages.forEach(m => { if (!m.is_mine) m.is_read = true; });

                renderMessages(); refreshUnread();

            } catch {} finally { markReadPending = false; }

        }

        chatBody.addEventListener('click', tryMarkRead);

        /* ── Search ── */

        const searchBtn     = document.getElementById('searchBtn');

        const searchOverlay = document.getElementById('searchOverlay');

        const searchInput   = document.getElementById('searchInput');

        const searchResults = document.getElementById('searchResults');

        const searchClose   = document.getElementById('searchClose');

        function openSearch() {

            searchOverlay.style.display = 'flex';

            searchInput.value = '';

            searchResults.innerHTML = '<div class="wx-search-empty">输入关键词开始搜索</div>';

            setTimeout(() => searchInput.focus(), 50);

        }

        function closeSearch() { searchOverlay.style.display = 'none'; }

        searchBtn.addEventListener('click', openSearch);

        searchClose.addEventListener('click', closeSearch);

        let searchTimer = null;

        searchInput.addEventListener('input', () => {

            if (searchTimer) clearTimeout(searchTimer);

            const q = searchInput.value.trim();

            if (!q) { searchResults.innerHTML='<div class="wx-search-empty">输入关键词开始搜索</div>'; return; }

            searchTimer = setTimeout(() => doSearch(q), 300);

        });

        async function doSearch(q) {

            try {

                const r = await fetch(`/wechat/api/messages/search?q=${encodeURIComponent(q)}`);

                const data = await r.json();

                const results = data.results || [];

                if (!results.length) {

                    searchResults.innerHTML = `<div class="wx-search-empty">没有找到 "<b>${escHtml(q)}</b>"</div>`;

                    return;

                }

                searchResults.innerHTML = results.map(m => {

                    const time = m.created_at ? new Date(m.created_at).toLocaleString('zh-CN') : '';

                    const preview = m.msg_type === 'image' ? '[图片]' : m.content;

                    return `<div class="wx-search-item" data-msg-id="${m.id}">

                        <div class="wx-search-item-meta">${m.is_mine?'我':(partnerInfo?.display_name||'对方')} · ${time}</div>

                        <div class="wx-search-item-content">${highlight(preview, q)}</div>

                    </div>`;

                }).join('');

                searchResults.querySelectorAll('.wx-search-item').forEach(el => {

                    el.addEventListener('click', () => {

                        jumpToMessage(parseInt(el.dataset.msgId, 10));

                        closeSearch();

                    });

                });

            } catch { searchResults.innerHTML='<div class="wx-search-empty">搜索失败</div>'; }

        }

        function highlight(text, q) {

            const safe = escHtml(text);

            const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');

            return safe.replace(re, m => `<mark>${m}</mark>`);

        }

        function jumpToMessage(id) {

            const el = chatBody.querySelector(`.wx-msg[data-msg-id="${id}"]`);

            if (!el) return;

            el.scrollIntoView({behavior:'smooth', block:'center'});

            el.style.transition='background 0.4s';

            el.style.background='rgba(99,102,241,0.2)';

            setTimeout(() => { el.style.background=''; }, 1400);

        }

        /* ── Init ── */

        async function init() {

            try {

                const r = await fetch('/wechat/auth/api/me');

                if (!r.ok) { window.location.href='/wechat/auth/login'; return; }

                const me = await r.json();

                myId = me.id; myName = me.display_name || '我';

                myUser = {

                    id: me.id,

                    username: me.username,

                    display_name: myName,

                    avatar_type: me.avatar_type,

                    avatar_color: me.avatar_color,

                    avatar_emoji: me.avatar_emoji || null,

                    avatar_url: me.avatar_url || null,

                };

            } catch { window.location.href='/wechat/auth/login'; return; }

            await loadMessages({initial: true});

        }

        /* ── 头像跨标签同步 ── */

        window.addEventListener('wechat-avatar-updated', (e) => {

            const u = e.detail;

            if (!myUser) return;

            myUser.avatar_type  = u.avatar_type;

            myUser.avatar_color = u.avatar_color;

            myUser.avatar_emoji = u.avatar_emoji || null;

            myUser.avatar_url   = u.avatar_url   || null;

            renderMessages();

        });

        async function loadMessages({initial = false} = {}) {

            if (loadingMessages) return;

            loadingMessages = true;

            try {

                const query = initial || !messages.length ? '?limit=50' : `?after_id=${messages[messages.length - 1].id}&limit=100`;

                const r = await fetch(`/wechat/api/messages${query}`);

                if (!r.ok) return;

                const data = await r.json();

                const incoming = data.messages || [];
                const knownIds = new Set(messages.map(message => message.id));
                const newMessages = incoming.filter(message => !knownIds.has(message.id));
                if (initial || !messages.length) messages = incoming;
                else messages.push(...newMessages);
                hasMoreMessages = Boolean(data.has_more);

                partnerInfo = data.partner;

                renderHeader();

                if (initial || newMessages.length) renderMessages({forceBottom: initial});

                await markMessagesRead(initial ? messages : newMessages);

                if (initial) {

                    await fetch('/wechat/api/messages/mark_all_read', {
                        method: 'POST',
                        credentials: 'include',
                    });

                }

                refreshUnread();


            } catch (e) { console.error('load failed', e); }

            finally { loadingMessages = false; }

        }

        async function loadOlderMessages() {

            if (loadingOlder || !hasMoreMessages || !messages.length) return;

            loadingOlder = true;

            const oldHeight = chatBody.scrollHeight;

            const oldTop = chatBody.scrollTop;

            try {

                const r = await fetch(`/wechat/api/messages?before_id=${messages[0].id}&limit=50`);

                if (!r.ok) return;

                const data = await r.json();

                const knownIds = new Set(messages.map(message => message.id));

                messages = [...(data.messages || []).filter(message => !knownIds.has(message.id)), ...messages];

                hasMoreMessages = Boolean(data.has_more);

                renderMessages();

                chatBody.scrollTop = chatBody.scrollHeight - oldHeight + oldTop;

            } catch (e) { console.error('load older failed', e); }

            finally { loadingOlder = false; }

        }

        chatBody.addEventListener('scroll', () => {

            if (chatBody.scrollTop < 80) loadOlderMessages();

        });

        function normalizeImageItem(item) {

            if (typeof item === 'string') return {url: item, thumb_url: item};

            if (!item || typeof item !== 'object' || !item.url) return null;

            return {url: item.url, thumb_url: item.thumb_url || item.url};

        }

        function renderMessages({forceBottom = false} = {}) {

            const wasAtBottom = chatBody.scrollHeight - chatBody.scrollTop <= chatBody.clientHeight + 80;

            chatBody.querySelectorAll('.wx-msg, .wx-date-divider').forEach(el => el.remove());

            prevDate = '';

            if (!messages.length) {

                emptyState.style.display = 'flex';

                return;

            }

            emptyState.style.display = 'none';

            const meName = myName;

            const partnerName = partnerInfo?.display_name || '对方';

            const partnerUser = partnerInfo || {

                display_name: partnerName,

                avatar_type: 'color',

                avatar_color: '#576B95',

            };

            const fragment = document.createDocumentFragment();

            messages.forEach(msg => {

                const dateKey = msg.created_at?.split('T')[0] || '';

                if (dateKey !== prevDate) {

                    prevDate = dateKey;

                    const divider = document.createElement('div');

                    divider.className = 'wx-date-divider';

                    divider.innerHTML = `<span class="wx-date-chip">${dateKey}</span>`;

                    fragment.appendChild(divider);

                }

                const el = document.createElement('div');

                el.className = 'wx-msg ' + (msg.is_mine ? 'mine' : 'partner');

                el.dataset.msgId = msg.id;

                const avatarEl = document.createElement('div');

                avatarEl.className = 'wx-msg-avatar';

                renderAvatarEl(avatarEl, msg.is_mine ? myUser : partnerUser, msg.is_mine);

                const timeStr = msg.created_at

                    ? new Date(msg.created_at).toLocaleTimeString('zh-CN', {

                        hour: '2-digit', minute: '2-digit', hour12: false,

                    })

                    : '';

                let inner = '';

                if (msg.msg_type === 'image' && msg.image_urls?.length) {

                    const imageItems = msg.image_urls.map(normalizeImageItem).filter(Boolean);

                    const imgs = imageItems.map((image, i) =>

        /* ── Send ── */

        let pendingFiles = [];

        async function sendMessage() {

        async function sendTextMessage(content) {

            sendBtn.disabled = true; msgInput.value = '';

                const r = await fetch('/wechat/api/messages/send', {

                    method:'POST', headers:{'Content-Type':'application/json'},

                    body: JSON.stringify({content}),

                const d = await r.json();

                messages.push(d.message); prevDate=''; renderMessages(); scrollBottom();

            } catch { msgInput.value = content; showToast('发送失败','error'); }

            finally { sendBtn.disabled = false; msgInput.focus(); }

        }

            sendBtn.disabled = true;

            try {

                const fd = new FormData();

                files.forEach(f => fd.append('images', f));

                const ur = await fetch('/wechat/api/upload/image', {method:'POST', body:fd});

                const ud = await ur.json();

                if (!ur.ok) { pendingFiles=files; renderPreview(); showToast(ud.error||'上传失败','error'); return; }

                const mr = await fetch('/wechat/api/messages/send', {

                    method:'POST', headers:{'Content-Type':'application/json'},

                    body: JSON.stringify({content: text||'[图片]', msg_type:'image', image_urls: ud.images || ud.urls}),

                });

                const md = await mr.json();

                if (!mr.ok) { showToast(md.error||'发送失败','error'); return; }

                messages.push(md.message); prevDate=''; renderMessages(); scrollBottom(); msgInput.value='';

        /* ── Long press menu ── */

        let longPressTimer = null;

            el.addEventListener('mousedown', start);

            document.body.appendChild(menu);

            const rect = el.getBoundingClientRect();

            const mRect = menu.getBoundingClientRect();

            let left = rect.left + rect.width/2 - mRect.width/2;

            let top  = rect.top - mRect.height - 8;

            if (top < 60) top = rect.bottom + 8;

            left = Math.max(10, Math.min(window.innerWidth - mRect.width - 10, left));

            menu.style.left = left+'px'; menu.style.top = top+'px';

            menu.querySelector('[data-act="recall"]').addEventListener('click', async () => {

                menu.remove();

                await recallMessage(msg.id);

            setTimeout(() => {

                const close = (e2) => { if (!menu.contains(e2.target)) { menu.remove(); document.removeEventListener('click', close, true); } };

                document.addEventListener('click', close, true);

        async function recallMessage(msgId) {

            try {

                const r = await fetch(`/wechat/api/messages/${msgId}/recall`, {method:'POST'});

                const d = await r.json();

                if (!r.ok) { showToast(d.error||'撤回失败','error'); return; }

                const m = messages.find(x => x.id===msgId);

        /* ── Lightbox v2 — global gallery ── */

        const lightbox = document.getElementById('lightbox');

        const lbImg     = document.getElementById('lbImg');

        const lbImgWrap = document.getElementById('lbImgWrap');

        const lbCounter = document.getElementById('lbCounter');

        const lbStage   = document.getElementById('lbStage');

        const lbInfo    = document.getElementById('lbInfo');

        const lbInfoBtn = document.getElementById('lbInfoBtn');

        const lbFsBtn   = document.getElementById('lbFsBtn');

        const lbClose   = document.getElementById('lightboxClose');

        const lbThumbs  = document.getElementById('lbThumbs');

        const lbMeta    = document.getElementById('lbMeta');

        let galleryImages = [];  // 全局图片索引表: { url, msgId, localIdx, isMine, displayName, createdAt }

        let lbImages = [], lbIdx = 0;

        let lbScale = 1, lbX = 0, lbY = 0;

        let lbDragging = false, lbDragStartX = 0, lbDragStartY = 0, lbLastX = 0, lbLastY = 0;

        let lbPinchDist = 0, lbLastScale = 1;

        let lbShowInfo = false, lbFullscreen = false;

        const lbLoadedImgs = {};

        let lbExitMsgId = null;

        function getImageItems(msg) {

            return (msg.image_urls || []).map(normalizeImageItem).filter(Boolean);

        }

        function rebuildGallery() {

            galleryImages = [];

            messages.forEach(msg => {

                if (msg.recalled || !msg.image_urls?.length) return;

                const name = msg.is_mine ? myName : (partnerInfo?.display_name || '对方');

                getImageItems(msg).forEach((image, i) => {

                    galleryImages.push({ ...image, msgId: msg.id, localIdx: i, isMine: msg.is_mine, displayName: name, createdAt: msg.created_at });

                });

            });

        }

        function openLightbox(msg, localIdx) {

            rebuildGallery();

            if (!galleryImages.length) return;

            const gi = galleryImages.findIndex(g => g.msgId === msg.id && g.localIdx === localIdx);

            lbImages = galleryImages.map(g => g.url);

            lbIdx = gi >= 0 ? gi : 0;

            lbExitMsgId = msg.id;

            lbScale = 1; lbX = 0; lbY = 0; lbShowInfo = false;

            lbInfo.style.display = 'none';

            lbFsBtn.textContent = '⛶';

            lbFullscreen = false;

            renderThumbs();

            showLightboxImg(true);

            lightbox.style.display = 'flex';

            lightbox.style.animation = 'fadeIn 0.15s ease both';

            document.body.style.overflow = 'hidden';

        }

        function closeLightbox() {

            lightbox.style.animation = 'fadeOut 0.15s ease both';

            setTimeout(() => {

                lightbox.style.display = 'none';

                document.body.style.overflow = '';

                lbExitMsgId = null;

            }, 140);

        }

        function showLightboxImg(animate) {

            const url = lbImages[lbIdx];

            const gi = galleryImages[lbIdx];

            lbCounter.textContent = `${lbIdx + 1} / ${lbImages.length}`;

            // Meta bar: 谁发的 · 时间

            if (gi) {

                const ts = gi.createdAt

                    ? new Date(gi.createdAt).toLocaleString('zh-CN', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit', hour12:false})

                    : '';

                lbMeta.textContent = `${gi.displayName} · ${ts}`;

                lbMeta.style.display = 'block';

            } else {

                lbMeta.style.display = 'none';

            }

            lbImg.addEventListener('load', () => {

                lbImg.style.opacity = '1';

            });

            if (animate) {

                lbImg.style.transition = 'opacity 0.15s';

                lbImg.style.opacity = '0';

                setTimeout(() => { lbImg.src = url; lbImg.style.opacity = '1'; }, 160);

            } else {

                lbImg.src = url;

            }

            lbScale = 1; lbX = 0; lbY = 0;

            applyTransform(false);

            lbThumbs.querySelectorAll('.wx-lb-thumb').forEach((t, i) => {

                t.classList.toggle('active', i === lbIdx);

            });

            lbThumbs.querySelectorAll('.wx-lb-thumb')[lbIdx]?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            if (lbImages[lbIdx - 1]) loadImg(lbImages[lbIdx - 1]);

            if (lbImages[lbIdx + 1]) loadImg(lbImages[lbIdx + 1]);

            updateInfo(url);

        }

        function loadImg(url) {

            if (lbLoadedImgs[url]) return;

            const img = new Image();

            img.onload = () => { lbLoadedImgs[url] = img; };

            img.src = url;

        }

        function applyTransform(animate) {

            const t = `translate3d(${lbX}px, ${lbY}px, 0) scale(${lbScale})`;

            lbImgWrap.style.transition = animate ? 'transform 0.25s cubic-bezier(0.22,1,0.36,1)' : 'none';

            lbImgWrap.style.transform = t;

            lbImgWrap.style.willChange = 'transform';

        }

        function clampX() {

            const maxX = (lbScale - 1) * window.innerWidth / 2;

            return Math.max(-maxX, Math.min(maxX, lbX));

        }

        function clampY() {

            const maxY = (lbScale - 1) * window.innerHeight / 2;

            return Math.max(-maxY, Math.min(maxY, lbY));

        }

        function prevImg() { lbIdx = (lbIdx - 1 + lbImages.length) % lbImages.length; showLightboxImg(true); }

        function nextImg() { lbIdx = (lbIdx + 1) % lbImages.length; showLightboxImg(true); }

        // Touch: swipe / pinch

        let swipeStartX = 0, swipeStartY = 0, swipeVelocity = 0, swipeLastX = 0, swipeLastTime = 0;

        lbStage.addEventListener('touchstart', e => {

            if (e.touches.length === 1) {

                swipeStartX = e.touches[0].clientX; swipeStartY = e.touches[0].clientY;

                swipeLastX = swipeStartX; swipeLastTime = Date.now(); swipeVelocity = 0;

                lbDragging = true; lbDragStartX = lbX; lbDragStartY = lbY;

            } else if (e.touches.length === 2) {

                lbDragging = false;

                lbPinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);

                lbLastScale = lbScale;

            }

        }, { passive: true });

        lbStage.addEventListener('touchmove', e => {

            if (e.touches.length === 1 && lbDragging && lbScale <= 1) {

                const dx = e.touches[0].clientX - swipeStartX;

                const dy = e.touches[0].clientY - swipeStartY;

                if (Math.abs(dx) > Math.abs(dy)) {

                    e.preventDefault();

                    lbX = lbDragStartX + dx; lbY = lbDragStartY + dy;

                    lbX = clampX(); lbY = clampY();

                    applyTransform(false);

                    const now = Date.now();

                    swipeVelocity = (e.touches[0].clientX - swipeLastX) / (now - swipeLastTime + 1);

                    swipeLastX = e.touches[0].clientX; swipeLastTime = now;

                }

            } else if (e.touches.length === 2 && lbScale > 1) {

                e.preventDefault();

                const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);

                const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;

                const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;

                const newScale = Math.max(0.5, Math.min(5, lbLastScale * (dist / lbPinchDist)));

                const cx = lbStage.offsetWidth / 2, cy = lbStage.offsetHeight / 2;

                lbX += (midX - cx) * (1 - newScale / lbScale);

                lbY += (midY - cy) * (1 - newScale / lbScale);

                lbScale = newScale;

                lbX = clampX(); lbY = clampY();

                applyTransform(false);

            }

        }, { passive: false });

        lbStage.addEventListener('touchend', e => {

            lbDragging = false;

            if (lbScale <= 1) {

                if (Math.abs(swipeVelocity) > 0.3 && Math.abs(lbX) > 60) {

                    if (swipeVelocity < 0) nextImg(); else prevImg();

                } else { lbX = 0; lbY = 0; applyTransform(true); }

            }

        }, { passive: true });

        // Mouse drag

        lbStage.addEventListener('mousedown', e => {

            lbDragging = true; lbDragStartX = lbX; lbDragStartY = lbY;

            swipeStartX = e.clientX; swipeStartY = e.clientY;

        });

        window.addEventListener('mousemove', e => {

            if (!lbDragging || lbScale <= 1) return;

            lbX = lbDragStartX + (e.clientX - swipeStartX); lbY = lbDragStartY + (e.clientY - swipeStartY);

            lbX = clampX(); lbY = clampY();

            applyTransform(false);

        });

        window.addEventListener('mouseup', () => {

            if (lbDragging && lbScale <= 1) { lbX = 0; lbY = 0; applyTransform(true); }

            lbDragging = false;

        });

        // Double click → zoom

        lbStage.addEventListener('dblclick', e => {

            if (lbScale > 1) { lbScale = 1; lbX = 0; lbY = 0; applyTransform(true); }

            else {

                const rect = lbStage.getBoundingClientRect();

                const cx = e.clientX - rect.left - rect.width / 2;

                const cy = e.clientY - rect.top - rect.height / 2;

                lbScale = 2.5;

                lbX = -cx * (lbScale - 1);

                lbY = -cy * (lbScale - 1);

                lbX = clampX(); lbY = clampY();

                applyTransform(true);

            }

        });

        // Wheel zoom

        lbStage.addEventListener('wheel', e => {

            e.preventDefault();

            const delta = e.deltaY < 0 ? 1.15 : 0.87;

            const rect = lbStage.getBoundingClientRect();

            const cx = e.clientX - rect.left - rect.width / 2;

            const cy = e.clientY - rect.top - rect.height / 2;

            lbScale = Math.max(0.5, Math.min(5, lbScale * delta));

            lbX += (e.deltaY < 0 ? -1 : 1) * cx * Math.abs(delta - 1);

            lbY += (e.deltaY < 0 ? -1 : 1) * cy * Math.abs(delta - 1);

            lbX = clampX(); lbY = clampY();

            applyTransform(false);

        }, { passive: false });

        function renderThumbs() {

            if (!lbThumbs) return;

            lbThumbs.innerHTML = galleryImages.map((image, i) =>

            `<img class="wx-lb-thumb${i === lbIdx ? ' active' : ''}" data-idx="${i}" src="${image.thumb_url}" loading="lazy" decoding="async" alt="">`

            ).join('');

            lbThumbs.querySelectorAll('.wx-lb-thumb').forEach(th => {

                th.addEventListener('click', () => {

                    lbIdx = parseInt(th.dataset.idx, 10); showLightboxImg(true);

                });

            });

        }

        function updateInfo(url) {

            const name = url.split('/').pop() || '—';

            const el = document.getElementById('lbFileName'); if (el) el.textContent = name;

            const idx = document.getElementById('lbIndex'); if (idx) idx.textContent = `${lbIdx + 1} / ${lbImages.length}`;

        }

        lbInfoBtn?.addEventListener('click', () => {

            lbShowInfo = !lbShowInfo;

            lbInfo.style.display = lbShowInfo ? 'flex' : 'none';

        });

        lbFsBtn?.addEventListener('click', () => {

            lbFullscreen = !lbFullscreen;

            if (lbFullscreen) {

                lbFsBtn.textContent = '✕';

                lightbox.requestFullscreen?.() || (lightbox.style.background = 'rgba(0,0,0,1)');

            } else {

                lbFsBtn.textContent = '⛶';

                document.exitFullscreen?.();

            }

        });

        lbClose.addEventListener('click', closeLightbox);

        lightbox.addEventListener('click', e => {

            if (e.target === lightbox || e.target.id === 'lbBg') closeLightbox();

        });

        document.addEventListener('keydown', e => {

            if (lightbox.style.display === 'none') return;

            if      (e.key === 'Escape')     closeLightbox();

            else if (e.key === 'ArrowLeft')  prevImg();

            else if (e.key === 'ArrowRight') nextImg();

            else if (e.key === 'Home')        { lbIdx = 0; showLightboxImg(true); }

            else if (e.key === 'End')         { lbIdx = lbImages.length - 1; showLightboxImg(true); }

            else if (e.key === ' ')           { e.preventDefault(); lbScale = lbScale > 1 ? 1 : 2.5; lbX = 0; lbY = 0; applyTransform(true); }

            else if (e.key === 'f' || e.key === 'F') lbFsBtn?.click();

            else if (e.key === 'i' || e.key === 'I') lbInfoBtn?.click();

            else if (e.key === '0')           { lbScale = 1; lbX = 0; lbY = 0; applyTransform(true); }

            else if (e.key === '+' || e.key === '=') { lbScale = Math.min(5, lbScale * 1.2); applyTransform(true); }

            else if (e.key === '-')            { lbScale = Math.max(0.5, lbScale / 1.2); applyTransform(true); }

        });

        /* ── Toast helper ── */

        function showToast(msg, type='default') {

            const old = document.getElementById('wxToast');

            if (old) old.remove();

            const t = document.createElement('div');

            t.id = 'wxToast';

            t.className = `wx-toast ${type}`;

            t.textContent = msg;

            document.body.appendChild(t);

            setTimeout(() => t.remove(), 3000);

        }

        /* ── Heartbeat ── */

        function fetchHeartbeat() {

            fetch('/wechat/auth/api/heartbeat', {method:'POST', credentials:'include'}).catch(() => {});

        }

        /* ── Poll ── */

        let poll = setInterval(() => { loadMessages(); refreshUnread(); fetchHeartbeat(); }, 5000);

        document.addEventListener('visibilitychange', () => {

            if (document.hidden) { clearInterval(poll); }

            else { poll = setInterval(() => { loadMessages(); refreshUnread(); fetchHeartbeat(); }, 5000); loadMessages(); refreshUnread(); fetchHeartbeat(); }

        });

        init();

        /* ── Web Push 订阅（iPhone 添加到主屏幕后可用） ─────────────── */
        (function setupPush(){
            const pushBtn = document.getElementById('pushBtn');
            if (!pushBtn) return;
            pushBtn.style.display = 'inline-flex';

            const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches
                || window.navigator.standalone === true;

            async function refreshStatus() {
                try {
                    const r = await fetch('/wechat/push/api/status');
                    if (!r.ok) { pushBtn.style.display='none'; return; }
                    const s = await r.json();
                    pushBtn.dataset.subscribed = s.subscribed ? '1' : '0';
                    pushBtn.title = s.subscribed ? '已开启手机提醒' : '开启手机提醒';
                    pushBtn.style.opacity = s.subscribed ? '1' : '0.6';
                } catch (e) { pushBtn.style.display='none'; }
            }

            function urlB64ToUint8Array(b64) {
                const pad = '='.repeat((4 - b64.length % 4) % 4);
                const b = (b64 + pad).replace(/-/g, '+').replace(/_/g, '/');
                const raw = atob(b);
                return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
            }

            async function subscribe() {
                if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
                    showToast('当前浏览器不支持推送，请用 Safari 并添加到主屏幕', 'error'); return;
                }
                if (isIOS && !isStandalone) {
                    showToast('iPhone 用户请先把网页「添加到主屏幕」，再点这个按钮', 'error'); return;
                }
                const perm = await Notification.requestPermission();
                if (perm !== 'granted') { showToast('请允许通知权限', 'error'); return; }

                const reg = await navigator.serviceWorker.ready;
                const keyResp = await fetch('/wechat/push/api/vapid_public_key');
                const { key } = await keyResp.json();

                let sub = await reg.pushManager.getSubscription();
                if (!sub) {
                    sub = await reg.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: urlB64ToUint8Array(key),
                    });
                }
                const r = await fetch('/wechat/push/api/subscribe', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify(sub),
                });
                if (r.ok) {
                    showToast('已开启,试试看能不能收到提醒', 'default');
                    refreshStatus();
                    // 立刻推一条测试
                    await fetch('/wechat/push/api/test', {method:'POST'});
                } else {
                    showToast('订阅失败,请重试', 'error');
                }
            }

            async function unsubscribe() {
                const reg = await navigator.serviceWorker.ready;
                const sub = await reg.pushManager.getSubscription();
                if (!sub) { refreshStatus(); return; }
                await sub.unsubscribe();
                await fetch('/wechat/push/api/unsubscribe', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({endpoint: sub.endpoint}),
                });
                showToast('已关闭手机提醒', 'default');
                refreshStatus();
            }

            pushBtn.addEventListener('click', () => {
                if (pushBtn.dataset.subscribed === '1') {
                    if (confirm('确定关闭手机提醒吗？')) unsubscribe();
                } else {
                    subscribe();
                }
            });

            // 注册 Service Worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/static/wechat/sw.js', {scope: '/static/wechat/'})
                    .catch(()=>{});
            }
            refreshStatus();
        })();

    })();

    </script>
